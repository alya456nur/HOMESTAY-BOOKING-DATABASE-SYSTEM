<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Employee</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

<header class="top-header">
  <div class="header-inner">
    <div class="header-left">
      <h1>Edit Employee</h1>
      <p>Update employee information and salary.</p>
    </div>

    <div class="header-right">
      <div class="header-chip">
        <i class="fa-solid fa-pen-to-square"></i>
        <strong>Action</strong>
        <span style="opacity:.85;">Edit</span>
      </div>
            
      <a href="index.html" class="header-icon" title="Home">
        <i class="fa-solid fa-house"></i>
      </a>
    </div>
  </div>
</header>

<div class="page-shell">

  <div class="page-toolbar" style="max-width: 820px;">
    <div class="page-title">
      <h2>Employee Details</h2>
      <p>Edit the form and save changes.</p>
    </div>

    <div class="toolbar-actions">
      <button class="action-btn" type="button" onclick="go('employees.html')">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>
    </div>
  </div>

  <main class="content-card form-card">
    <form id="editEmployeeForm">

      <div class="form-group">
        <label for="empId">Employee ID</label>
        <input type="text" id="empId" name="empId" disabled>
      </div>

      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName">
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName">
      </div>

      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob">
      </div>

      <div class="form-group">
        <label for="hireDate">Hire Date</label>
        <input type="date" id="hireDate" name="hireDate">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone">
      </div>

      <div class="form-group">
        <label for="empType">Employment Type</label>
        <select class="typeFilter" id="empType">
          <option value="Full-Time">Full-Time</option>
          <option value="Part-Time">Part-Time</option>
        </select>
      </div>

      <div class="form-group">
        <label for="wage">Salary</label>
        <div class="input-prefix">
          <span>RM</span>
          <input type="number" id="wage" value="0">
          <span></span>
        </div>
      </div>

      <div class="action-group" style="justify-content:flex-start; gap:10px; margin-top:10px;">
        <button type="button" class="btn-edit" onclick="saveEmployee()">
          <i class="fa-solid fa-floppy-disk"></i> Save Changes
        </button>
        <button type="button" class="btn-remove" onclick="resetForm()">
          Reset
        </button>
      </div>

    </form>
  </main>
</div>

<!-- Alert Modal -->
<div id="alertModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <p id="alertMessage">Employee Details updated successfully!</p>
    <button class="btn-view" id="okBtn">OK</button>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/edit_employee.js"></script>
</body>
</html>
