<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Employees</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

<header class="top-header">
  <div class="header-inner">
    <div class="header-left">
      <h1>Employees</h1>
      <p>Manage employee profiles, employment type, and records.</p>
    </div>

    <div class="header-right">
      <div class="header-chip">
        <i class="fa-solid fa-user-tie"></i>
        <strong>Module</strong>
        <span style="opacity:.85;">Employees</span>
      </div>
            
      <a href="index.html" class="header-icon" title="Home">
        <i class="fa-solid fa-house"></i>
      </a>
    </div>
  </div>
</header>

<div class="page-shell">

  <div class="page-toolbar">
    <div class="page-title">
      <h2>Employee List</h2>
      <p>Search and filter employees quickly.</p>
    </div>

    <div class="toolbar-actions">
      <button class="action-btn" type="button" onclick="go('index.html')">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>

      <button class="action-btn primary" type="button" onclick="go('add_employee.html')">
        <i class="fa-solid fa-plus"></i> Add Employee
      </button>
    </div>
  </div>

  <main class="content-card">

    <div class="filters-wrap">
      <div class="filter-panel" role="region" aria-label="Employee filters">

        <div class="control search-control">
          <label for="searchInput">Search</label>
          <input type="text" id="searchInput" placeholder="Search by id, name...">
        </div>

        <div class="control">
          <label for="typeFilter">Employment Type</label>
          <select class="typeFilter" id="typeFilter">
            <option value="">All Types</option>
            <option value="Full-Time">Full-Time</option>
            <option value="Part-Time">Part-Time</option>
          </select>
        </div>

        <div class="control">
          <label style="opacity:0;">Clear</label>
          <button class="btn-clear-filters" type="button" onclick="clearEmployeeFilters()">
            <i class="fa-regular fa-circle-xmark"></i> Clear
          </button>
        </div>

      </div>
    </div>

    <div class="table-wrapper" style="margin-top:12px;">
      <table id="employeesTable">
        <thead>
          <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Date of Birth</th>
            <th>Hire Date</th>
            <th>Phone Number</th>
            <th>Type</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="employeesTableBody">
          <!-- rows inserted by JS -->
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <p>Are you sure you want to delete this employee?</p>

    <div class="action-group" style="justify-content:center; gap:12px; margin-top:14px;">
      <button class="btn-remove" id="confirmDelete">Delete</button>
      <button class="btn-cancel" id="cancelDelete">Cancel</button>
    </div>
  </div>
</div>

<!-- Success/Error Modal -->
<div id="successModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <p id="successMessage">Employee removed successfully!</p>
    <button class="btn-view" id="okSuccessBtn">OK</button>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/employee.js"></script>

<script>
  function clearEmployeeFilters(){
    document.getElementById('searchInput').value = '';
    document.getElementById('typeFilter').value = '';
    if (typeof filterTable === 'function') filterTable();
  }
</script>

</body>
</html>
