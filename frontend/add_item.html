<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Item</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

<header class="top-header">
  <div class="header-inner">
    <div class="header-left">
      <h1>Add Item</h1>
      <p>Create a new add-on, package, or facility item.</p>
    </div>

    <div class="header-right">
      <div class="header-chip">
        <i class="fa-solid fa-circle-plus"></i>
        <strong>Action</strong>
        <span style="opacity:.85;">Create</span>
      </div>
      
      <a href="index.html" class="header-icon" title="Home">
        <i class="fa-solid fa-house"></i>
      </a>
    </div>
  </div>
</header>

<div class="page-shell">

  <div class="page-toolbar" style="max-width: 820px;">
    <div class="page-title">
      <h2>Item Details</h2>
      <p>Fill in the form and save.</p>
    </div>

    <div class="toolbar-actions">
      <button class="action-btn" type="button" onclick="go('items.html')">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>
    </div>
  </div>

  <main class="content-card form-card">
    <form id="addItemForm">

      <div class="form-group">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" placeholder="Enter item name">
      </div>

      <div class="form-group">
        <label for="itemType">Type</label>
        <select id="itemType" class="typeFilter">
          <option value="">Select type</option>
          <option value="Add-on">Add-on</option>
          <option value="Package">Package</option>
          <option value="Facility">Facility</option>
        </select>
      </div>

      <div class="form-group">
        <label for="itemDesc">Description</label>
        <input type="text" id="itemDesc" placeholder="Item description">
      </div>

      <div class="form-group">
        <label for="rateType">Rate Type</label>
        <select class="typeFilter" id="rateType">
          <option value="">Select rate type</option>
          <option value="Hourly">Hourly</option>
          <option value="Daily">Daily</option>
          <option value="During Stay">During Stay</option>
        </select>
      </div>

      <div class="form-group">
        <label for="itemRate">Rate</label>
        <div class="input-prefix">
          <span>RM</span>
          <input type="number" id="itemRate" placeholder="0.00">
        </div>
      </div>

      <div class="form-group">
        <label for="itemStatus">Status</label>
        <select class="typeFilter" id="itemStatus">
          <option value="Available">Available</option>
          <option value="Unavailable">Unavailable</option>
        </select>
      </div>

      <div class="form-group">
        <label for="itemSupplier">Supplier</label>
        <select class="typeFilter" id="itemSupplier"></select>
      </div>

      <div class="action-group" style="justify-content:flex-start; gap:10px; margin-top: 10px;">
        <button type="button" class="btn-add" style="margin:0;" onclick="addItem()">
          <i class="fa-solid fa-plus"></i> Add Item
        </button>
        <button type="button" class="btn-remove" onclick="resetForm()">
          Reset
        </button>
      </div>

    </form>
  </main>
</div>

<!-- Alert Modal -->
<div id="alertModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <p id="alertMessage">Item added successfully!</p>
    <button class="btn-view" id="okBtn">OK</button>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/add_item.js"></script>
</body>
</html>
