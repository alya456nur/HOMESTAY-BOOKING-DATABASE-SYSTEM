<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Supplier</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

<header class="top-header">
  <div class="header-inner">
    <div class="header-left">
      <h1>Edit Supplier</h1>
      <p>Update supplier details and save changes.</p>
    </div>

    <div class="header-right">
      <div class="header-chip">
        <i class="fa-solid fa-pen-to-square"></i>
        <strong>Action</strong>
        <span style="opacity:.85;">Edit</span>
      </div>
            
      <a href="index.html" class="header-icon" title="Home">
        <i class="fa-solid fa-house"></i>
      </a>
    </div>
  </div>
</header>

<div class="page-shell">

  <div class="page-toolbar" style="max-width: 820px;">
    <div class="page-title">
      <h2>Supplier Details</h2>
      <p>Edit the supplier information and save.</p>
    </div>

    <div class="toolbar-actions">
      <button class="action-btn" type="button" onclick="go('suppliers.html')">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>
    </div>
  </div>

  <main class="content-card form-card">
    <form id="editSupplierForm">

      <div class="form-group">
        <label for="suppId">Supplier ID</label>
        <input type="text" id="suppId" disabled>
      </div>

      <div class="form-group">
        <label for="suppName">Supplier Name</label>
        <input type="text" id="suppName">
      </div>

      <div class="form-group">
        <label for="suppPhone">Phone Number</label>
        <input type="text" id="suppPhone">
      </div>

      <div class="form-group">
        <label for="suppEmail">Email</label>
        <input type="text" id="suppEmail">
      </div>

      <div class="form-group">
        <label for="suppAddress">Address</label>
        <input type="text" id="suppAddress">
      </div>

      <div class="action-group" style="justify-content:flex-start; gap:10px; margin-top:10px;">
        <button type="button" class="btn-edit" onclick="saveSupplier()">
          <i class="fa-solid fa-floppy-disk"></i> Save Changes
        </button>
        <button type="button" class="btn-remove" onclick="resetForm()">
          Reset
        </button>
      </div>

    </form>
  </main>
</div>

<!-- Alert Modal -->
<div id="alertModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <p id="alertMessage">Supplier details saved!</p>
    <button class="btn-view" id="okBtn" type="button">OK</button>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/edit_supplier.js"></script>
</body>
</html>
