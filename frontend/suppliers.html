<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Suppliers</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

<header class="top-header">
  <div class="header-inner">
    <div class="header-left">
      <h1>Suppliers</h1>
      <p>View suppliers and their total supplied items.</p>
    </div>

    <div class="header-right">
      <div class="header-chip">
        <i class="fa-solid fa-truck-field"></i>
        <strong>Module</strong>
        <span style="opacity:.85;">Suppliers</span>
      </div>

      <a href="index.html" class="header-icon" title="Home">
        <i class="fa-solid fa-house"></i>
      </a>
    </div>
  </div>
</header>

<div class="page-shell">

  <div class="page-toolbar">
    <div class="page-title">
      <h2>Supplier List</h2>
      <p>Search suppliers and view their total items.</p>
    </div>

    <div class="toolbar-actions">
      <button class="action-btn" type="button" onclick="go('index.html')">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>

      <button class="action-btn primary" type="button" onclick="go('add_supplier.html')">
        <i class="fa-solid fa-plus"></i> Add Supplier
      </button>
    </div>
  </div>

  <main class="content-card">

    <div class="filters-wrap">
      <div class="filter-panel" role="region" aria-label="Supplier filters">

        <div class="control search-control">
          <label for="searchInput">Search</label>
          <input type="text" id="searchInput" placeholder="Search by id or name..." />
        </div>

        <div class="control">
          <label for="minItems">Min Items</label>
          <input type="number" id="minItems" min="0" value="0" />
        </div>

        <div class="control">
          <label style="opacity:0;">Clear</label>
          <button class="btn-clear-filters" type="button" onclick="clearSupplierFilters()">
            <i class="fa-regular fa-circle-xmark"></i> Clear
          </button>
        </div>

      </div>
    </div>

    <div class="table-wrapper" style="margin-top:12px;">
      <table id="suppliersTable">
        <thead>
          <tr>
            <th>Supplier ID</th>
            <th>Name</th>
            <th>Total Items</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="supplierTbody"></tbody>
      </table>
    </div>

  </main>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <p>Are you sure you want to delete this supplier?</p>

    <div class="action-group" style="justify-content:center; gap:12px; margin-top:14px;">
      <button class="btn-remove" id="confirmDelete" type="button">Delete</button>
      <button class="btn-cancel" id="cancelDelete" type="button">Cancel</button>
    </div>
  </div>
</div>

<!-- Success/Error Modal -->
<div id="successModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <p id="successMessage">Done.</p>
    <button class="btn-view" id="okSuccessBtn" type="button">OK</button>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/supplier.js"></script>

<script>
  function clearSupplierFilters(){
    document.getElementById('searchInput').value = '';
    document.getElementById('minItems').value = 0;
    if (typeof filterTable === 'function') filterTable();
  }
</script>

</body>
</html>
