<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Housekeeping</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

<header class="top-header">
  <div class="header-inner">
    <div class="header-left">
      <h1>Housekeeping</h1>
      <p>Manage cleaning schedules and assigned employees.</p>
    </div>

    <div class="header-right">
      <div class="header-chip">
        <i class="fa-solid fa-broom"></i>
        <strong>Module</strong>
        <span style="opacity:.85;">Housekeeping</span>
      </div>
            
      <a href="index.html" class="header-icon" title="Home">
        <i class="fa-solid fa-house"></i>
      </a>
    </div>
  </div>
</header>

<div class="page-shell">

  <div class="page-toolbar">
    <div class="page-title">
      <h2>Housekeeping Records</h2>
      <p>Filter by status or cleaning date.</p>
    </div>

    <div class="toolbar-actions">
      <button class="action-btn" type="button" onclick="go('index.html')">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>

      <!-- Optional: only keep if you have add_housekeeping.html -->
      <button class="action-btn primary" type="button" onclick="go('add_housekeeping.html')">
        <i class="fa-solid fa-plus"></i> Add Record
      </button>
    </div>
  </div>

  <main class="content-card">

    <div class="filters-wrap">
      <div class="filter-panel" role="region" aria-label="Housekeeping filters">

        <div class="control">
          <label for="statusFilter">Status</label>
          <select class="typeFilter" id="statusFilter">
            <option value="">All Status</option>
            <option value="SCHEDULED">SCHEDULED</option>
            <option value="INCOMPLETE">INCOMPLETE</option>
            <option value="IN CLEANING">IN CLEANING</option>
            <option value="COMPLETED">COMPLETED</option>
          </select>
        </div>

        <div class="control">
          <label for="fromDate">From Date</label>
          <input type="date" id="fromDate" class="typeFilter">
        </div>

        <div class="control">
          <label style="opacity:0;">Clear</label>
          <button class="btn-clear-filters" type="button" onclick="clearHousekeepingFilters()">
            <i class="fa-regular fa-circle-xmark"></i> Clear
          </button>
        </div>

      </div>
    </div>

    <div class="table-wrapper" style="margin-top:12px;">
      <table id="housekeepingTable">
        <thead>
          <tr>
            <th>Homestay</th>
            <th>Employee</th>
            <th>Cleaning Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="housekeepingTbody">
          <!-- JS inserts rows here -->
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <p>Are you sure you want to delete this housekeeping record?</p>

    <div class="action-group" style="justify-content:center; gap:12px; margin-top:14px;">
      <button class="btn-remove" id="confirmDelete" type="button">Delete</button>
      <button class="btn-cancel" id="cancelDelete" type="button">Cancel</button>
    </div>
  </div>
</div>

<!-- Success/Error Modal -->
<div id="successModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <p id="successMessage">Done.</p>
    <button class="btn-view" id="okSuccessBtn" type="button">OK</button>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/housekeeping.js"></script>

<script>
  function clearHousekeepingFilters(){
    document.getElementById('statusFilter').value = '';
    document.getElementById('fromDate').value = '';
    if (typeof filterTable === 'function') filterTable();
  }
</script>

</body>
</html>
