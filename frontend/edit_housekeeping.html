<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Housekeeping</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

<header class="top-header">
  <div class="header-inner">
    <div class="header-left">
      <h1>Edit Housekeeping</h1>
      <p>Update cleaning date and housekeeping status.</p>
    </div>

    <div class="header-right">
      <div class="header-chip">
        <i class="fa-solid fa-pen-to-square"></i>
        <strong>Action</strong>
        <span style="opacity:.85;">Edit</span>
      </div>
            
      <a href="index.html" class="header-icon" title="Home">
        <i class="fa-solid fa-house"></i>
      </a>
    </div>
  </div>
</header>

<div class="page-shell">

  <div class="page-toolbar" style="max-width: 820px;">
    <div class="page-title">
      <h2>Housekeeping Details</h2>
      <p>Edit the record and save changes.</p>
    </div>

    <div class="toolbar-actions">
      <button class="action-btn" type="button" onclick="go('housekeeping.html')">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>
    </div>
  </div>

  <main class="content-card form-card">
    <form id="editHousekeepingForm">

      <div class="form-group">
        <label for="homestay">Homestay</label>
        <input type="text" id="homestay" readonly>
      </div>

      <div class="form-group">
        <label for="employee">Assigned Employee</label>
        <input type="text" id="employee" readonly>
      </div>

      <div class="form-group">
        <label for="hk_date">Cleaning Date</label>
        <input type="date" id="hk_date">
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select class="typeFilter" id="status">
          <option value="SCHEDULED">Scheduled</option>
          <option value="INCOMPLETE">Incomplete</option>
          <option value="IN CLEANING">In Cleaning</option>
          <option value="COMPLETED">Completed</option>
        </select>
      </div>

      <div class="action-group" style="justify-content:flex-start; gap:10px; margin-top:10px;">
        <button type="button" class="btn-edit" onclick="saveHousekeeping()">
          <i class="fa-solid fa-floppy-disk"></i> Save Changes
        </button>
        <button type="button" class="btn-remove" onclick="resetForm()">
          Reset
        </button>
      </div>

    </form>
  </main>
</div>

<!-- Alert Modal -->
<div id="alertModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <p id="alertMessage">Housekeeping updated successfully!</p>
    <button class="btn-view" id="okBtn" type="button">OK</button>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/edit_housekeeping.js"></script>
</body>
</html>
